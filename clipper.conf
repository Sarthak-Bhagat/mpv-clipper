# Where B (clipper.lua) writes its output. ~ is expanded.
#
# Left empty, it asks xdg-user-dirs for your videos folder and writes to
# <that>/clips -- which is the localised, user-configured one, not a guess at
# "~/Videos". Set it to an absolute path to put clips wherever you like.
outdir=

# Which files a clip produces. Turning one off skips that encode entirely;
# turning both off makes B mark a range and then say there is nothing to do.
mp4=yes
gif=yes
